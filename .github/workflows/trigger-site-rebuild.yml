name: Trigger Site Rebuild

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'README.md'
  # Lets the trigger be exercised on its own, which is how a dead token
  # gets caught before a real content change silently fails to publish.
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger site rebuild
        env:
          TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN}" ]; then
            echo "::error::SITE_DEPLOY_TOKEN is empty or missing."
            exit 1
          fi

          # --fail-with-body, not plain -f: both make curl exit non-zero on
          # an HTTP error, but only this one still prints the body, and the
          # body is where GitHub explains WHY (expired token, missing
          # contents:write, repo renamed). Without any fail flag — how this
          # ran until today — curl treats a 401 as success, the step goes
          # green, and the site silently never rebuilds.
          curl -X POST --fail-with-body -sS \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/GDGXICA/gdgxica.github.io/dispatches \
            -d '{"event_type":"data-updated"}'

          echo "Rebuild dispatched."
